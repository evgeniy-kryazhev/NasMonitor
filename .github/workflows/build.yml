name: Build desktop spike
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/NasMonitor.App/NasMonitor.App.csproj
      - run: dotnet build src/NasMonitor.App/NasMonitor.App.csproj --configuration Release --no-restore

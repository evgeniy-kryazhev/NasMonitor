name: Build desktop spike
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, 'feat/desktop-widget-spike']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore src/NasMonitor.App/NasMonitor.App.csproj
      - run: dotnet build src/NasMonitor.App/NasMonitor.App.csproj --configuration Release --no-restore
      - run: dotnet test tests/NasMonitor.App.Tests/NasMonitor.App.Tests.csproj --configuration Release --logger "trx;LogFileName=desktop-host.trx"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/NasMonitor.App.Tests/TestResults/*.trx

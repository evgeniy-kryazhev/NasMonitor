name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate stable release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
          {
              throw 'Only stable vMAJOR.MINOR.PATCH tags are supported.'
          }
          "RELEASE_VERSION=$($env:RELEASE_TAG.Substring(1))" | Add-Content $env:GITHUB_ENV
      - name: Test
        run: |
          dotnet test NasMonitor.slnx -c Release --filter 'TestCategory!=WindowsIntegration'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Publish all portable executables and bundles
        run: ./scripts/publish.ps1 -Runtime all -Version $env:RELEASE_VERSION
      - name: Upload complete assets before publishing the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-Content -LiteralPath artifacts/SHA256SUMS.txt | ForEach-Object {
              Join-Path 'artifacts' $_.Substring(66)
          }
          $files += 'artifacts/SHA256SUMS.txt'
          gh release create $env:RELEASE_TAG --verify-tag --draft --generate-notes @files
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; any draft remains unpublished.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the completed release failed.' }
